spring.application.name=jsonplaceholder-crud
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=jsonplaceholder
spring.cassandra.schema-action=none
spring.mvc.problemdetails.enabled=true
jsonplaceholder.import.enabled=false
jsonplaceholder.import.base-url=https://jsonplaceholder.typicode.com
jsonplaceholder.relations.backfill.enabled=false
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=jsonplaceholder-crud
security.jwt.access-token-ttl=PT15M
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
